name: Build

# Baut die Mod bei jedem Push und Pull Request. Ein Tag v* veröffentlicht
# zusätzlich ein GitHub-Release mit dem Jar.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
      - name: Minecraft-Jars und Fabric-API-Module holen
        run: tools/fetch-libs.sh
      - name: Build
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: atzen
          path: build/libs/*.jar

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: atzen
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/atzen-"${TAG#v}".jar --repo "$GITHUB_REPOSITORY" --title "Atzen ${TAG#v}" --generate-notes
